<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Products | Shani Traders, Saraipali</title>
<meta name="description" content="Cement, TMT sariya, bricks, sand, gitti, pipes, wire, tiles and paint with prices. Add to your list and enquire on WhatsApp.">
<meta name="theme-color" content="#1E252B">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="products">
<div id="site-header"></div>
<main id="main">
<section class="page-head"><div class="wrap">
  <h1>Products</h1><p>Prices are per unit shown. Final rate depends on quantity and delivery distance.</p>
</div></section>
<div class="wrap" style="padding-bottom:56px">
  <div class="tools">
    <div class="search"><span id="s-ico"></span><label class="sr" for="q">Search products</label>
      <input id="q" type="search" placeholder="Search cement, sariya, eent, pipe…" autocomplete="off"></div>
    <label class="sr" for="sort">Sort</label>
    <select id="sort"><option value="rec">Recommended</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name A to Z</option></select>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Category"></div>
  <p class="result-count" id="count" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
</div>
</main>
<div id="site-footer"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
(async () => {
  const { $, esc, cat, CATS, card, loadProducts, params, svg, waLink, S } = ST;
  $('#s-ico').outerHTML = svg('search');
  const st = { cat: params.get('cat') || 'all', q: params.get('q') || '', sort: 'rec' };
  $('#q').value = st.q;
  let ps = [];
  try { ps = await loadProducts(); }
  catch (e) { $('#grid').outerHTML = `<div class="empty"><p>The product list could not load. Check your internet and refresh, or ask us directly.</p><a class="btn btn-wa" href="${waLink('Namaste ' + S.name + ', I have an enquiry.')}" target="_blank" rel="noopener">Ask on WhatsApp</a></div>`; return; }
  const ids = [...new Set([...CATS.map(c => c.id), ...ps.map(p => p.category)])].filter(id => ps.some(p => p.category === id));
  function chips() {
    $('#chips').innerHTML = [['all', 'All', ps.length], ...ids.map(id => [id, cat(id).name, ps.filter(p => p.category === id).length])]
      .map(([id, name, n]) => `<button class="chip" data-cat="${esc(id)}" aria-pressed="${st.cat === id}">${esc(name)}<span>${n}</span></button>`).join('');
  }
  function render() {
    const words = st.q.toLowerCase().split(/\s+/).filter(Boolean);
    let list = ps.filter(p => (st.cat === 'all' || p.category === st.cat) &&
      words.every(w => (p.name + ' ' + p.brand + ' ' + p.tags + ' ' + cat(p.category).name).toLowerCase().includes(w)));
    const pv = p => p.price === '' ? Infinity : p.price;
    if (st.sort === 'low') list.sort((a, b) => pv(a) - pv(b));
    if (st.sort === 'high') list.sort((a, b) => (b.price || 0) - (a.price || 0));
    if (st.sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
    $('#count').textContent = list.length + (list.length === 1 ? ' item' : ' items') + (st.cat !== 'all' ? ' in ' + cat(st.cat).name : '');
    $('#grid').innerHTML = list.length ? list.map(card).join('') :
      `<div class="empty" style="grid-column:1/-1"><p>Nothing matches “${esc(st.q)}”. We stock more than we list, so ask us for it.</p>
       <a class="btn btn-wa" href="${waLink('Namaste ' + S.name + ', do you have ' + st.q + '?')}" target="_blank" rel="noopener">Ask on WhatsApp</a></div>`;
    const u = new URLSearchParams(); if (st.cat !== 'all') u.set('cat', st.cat); if (st.q) u.set('q', st.q);
    history.replaceState(null, '', location.pathname + (u.toString() ? '?' + u : ''));
  }
  $('#chips').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (!b) return; st.cat = b.dataset.cat; chips(); render(); });
  let t; $('#q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { st.q = e.target.value.trim(); render(); }, 150); });
  $('#sort').addEventListener('change', e => { st.sort = e.target.value; render(); });
  chips(); render();
})();
</script>
</body>
</html>
