<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Shani Traders · Master control</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="images/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="adm">
<header class="abar"><div class="aw">
  <img src="images/mark.png" alt=""><b>Master control</b>
  <a href="app.html" target="_blank" rel="noopener">Open app</a>
  <button class="tbtn" id="logout" hidden>Sign out</button>
</div></header>

<main>
  <section class="aw alogin" id="login">
    <form class="panel" id="lf">
      <h1>Sign in</h1>
      <div id="lmsg"></div>
      <div class="field"><label for="key">Admin key</label><input id="key" type="password" autocomplete="current-password" required></div>
      <button class="btn block">Sign in</button>
    </form>
  </section>

  <section class="aw" id="app" hidden>
    <nav class="atabs" role="tablist">
      <button role="tab" data-tab="orders" aria-selected="true">Orders <span class="cnt" id="n-orders"></span></button>
      <button role="tab" data-tab="items" aria-selected="false">Items</button>
      <button role="tab" data-tab="customers" aria-selected="false">Customers</button>
      <button role="tab" data-tab="gifts" aria-selected="false">Gifts <span class="cnt" id="n-gifts"></span></button>
      <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
    </nav>

    <div data-pane="orders">
      <div class="atools">
        <select id="ofilter" aria-label="Show"><option value="active">To do (placed, confirmed, on the way)</option><option value="Placed">Placed</option><option value="Confirmed">Confirmed</option>
          <option value="Out for delivery">Out for delivery</option><option value="Delivered">Delivered</option><option value="Cancelled">Cancelled</option><option value="all">All orders</option></select>
        <input id="oq" type="search" placeholder="Name, phone or order no." aria-label="Search orders">
        <button class="btn sm ghost" id="oreload">Refresh</button>
      </div>
      <div id="olist"></div>
    </div>

    <div data-pane="items" hidden>
      <div class="atools">
        <input id="iq" type="search" placeholder="Search items" aria-label="Search items">
        <select id="icat" aria-label="Category"></select>
        <select id="ishow" aria-label="Show"><option value="all">All items</option><option value="out">Out of stock</option><option value="hidden">Hidden from app</option><option value="noprice">No price</option><option value="nophoto">No photo</option></select>
      </div>
      <div class="atools">
        <button class="btn sm gold" id="iadd">Add item</button>
        <button class="btn sm ghost" id="istarter" hidden></button>
        <label class="btn sm ghost" for="bulkfile">Upload many photos</label><input type="file" id="bulkfile" accept="image/*" multiple class="sr">
        <button class="btn sm ghost" id="ilink">Link photos from Drive</button>
        <button class="btn sm ghost" id="iphotos" hidden>Find missing photos online</button>
      </div>
      <p class="muted" id="bulkmsg" style="margin:0 0 8px" hidden></p>
      <p class="muted" style="margin:0 0 8px">Change price, points, stock or visibility here, then press Save. Points are per unit; leave empty to use the ₹100 rate from Settings.</p>
      <div id="ilist"></div>
    </div>

    <div data-pane="customers" hidden>
      <div class="atools"><input id="cq" type="search" placeholder="Name, phone or village" aria-label="Search customers"><button class="btn sm ghost" id="creload">Refresh</button></div>
      <div id="clist"></div>
    </div>

    <div data-pane="gifts" hidden>
      <h2 class="ah">Gift requests</h2>
      <div id="rlist"></div>
      <h2 class="ah">Gift catalogue <button class="btn sm gold" id="gadd">Add gift</button></h2>
      <p class="muted" style="margin:0 0 8px">Only gifts switched on appear in the app. Stock empty means unlimited.</p>
      <div id="glist"></div>
    </div>

    <div data-pane="settings" hidden>
      <form class="panel" id="sf" style="margin:0"></form>
    </div>
  </section>
</main>

<div class="savebar" id="savebar"><div class="aw"><span id="dcount"></span><button class="btn sm ghost" id="discard">Discard</button><button class="btn sm gold" id="save">Save changes</button></div></div>

<dialog id="dlg">
  <form id="pf" method="dialog">
    <div class="dh"><h2 id="dtitle">Item</h2><button type="button" class="btn sm ghost" data-close>Close</button></div>
    <div class="db" id="dbody"></div>
    <div class="df"><button type="button" class="btn sm danger" id="pdel">Delete</button><span style="flex:1"></span><button type="button" class="btn sm ghost" data-close>Cancel</button><button class="btn sm" id="psave">Save</button></div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="admin.js"></script>
</body>
</html>
