<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Master control | Shani Traders</title>
<meta name="theme-color" content="#1E252B">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">
<div class="adm-bar"><div class="wrap">
  <b>Shani Traders master control</b>
  <a href="index.html" target="_blank" rel="noopener">View site</a>
  <button class="btn btn-sm btn-ghost" id="logout" hidden style="border-color:#5B636A">Sign out</button>
</div></div>

<main id="main">
  <section class="adm-login" id="login">
    <div class="panel">
      <h1 style="font-size:1.5rem">Sign in</h1>
      <div id="lmsg"></div>
      <form id="lf">
        <div class="field"><label for="key">Admin key</label><input id="key" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-dark btn-block">Sign in</button>
      </form>
    </div>
  </section>

  <section class="wrap" id="app" hidden>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="items">Items <span class="badge" id="n-items" style="background:var(--concrete)">0</span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="enq">Enquiries <span class="badge" id="n-new">0</span></button>
    </div>

    <div id="tab-items">
      <div class="adm-tools">
        <div class="search"><span id="s-ico"></span><label class="sr" for="aq">Search items</label><input id="aq" type="search" placeholder="Search items"></div>
        <label class="sr" for="acat">Category</label><select id="acat"></select>
        <label class="sr" for="ashow">Show</label>
        <select id="ashow"><option value="all">All items</option><option value="in">In stock</option><option value="out">Out of stock</option><option value="hidden">Hidden from site</option><option value="noprice">No price set</option></select>
        <button class="btn btn-hv" id="add">Add item</button>
      </div>
      <div class="adm-list" id="alist"><p>Loading items…</p></div>
    </div>

    <div id="tab-enq" hidden>
      <div class="adm-tools">
        <label class="sr" for="estat">Status</label>
        <select id="estat"><option value="all">All enquiries</option><option>New</option><option>Contacted</option><option>Quoted</option><option>Closed</option></select>
        <button class="btn btn-ghost" id="ereload">Refresh</button>
      </div>
      <div class="adm-list" id="elist"></div>
    </div>
  </section>
</main>

<div class="savebar" id="savebar"><div class="wrap">
  <span id="dcount">0 unsaved changes</span>
  <button class="btn btn-sm btn-ghost" id="discard" style="color:#fff;border-color:#5B636A">Discard</button>
  <button class="btn btn-sm btn-hv" id="save">Save changes</button>
</div></div>

<dialog id="dlg">
  <form id="pf" method="dialog">
    <div class="dlg-head"><h2 id="dtitle">Add item</h2><button type="button" class="btn btn-sm btn-ghost" data-close>Close</button></div>
    <div class="dlg-body">
      <input type="hidden" name="id">
      <div class="field"><label for="p-name">Item name</label><input id="p-name" name="name" required maxlength="120"></div>
      <div class="row2">
        <div class="field"><label for="p-cat">Category</label><select id="p-cat" name="category"></select></div>
        <div class="field"><label for="p-brand">Brand</label><input id="p-brand" name="brand" maxlength="60"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="p-unit">Sold per</label><input id="p-unit" name="unit" list="units" required placeholder="bag, kg, piece…" maxlength="30">
          <datalist id="units"><option>bag</option><option>kg</option><option>piece</option><option>trolley</option><option>tonne</option><option>cft</option><option>sq ft</option><option>box</option><option>coil</option><option>length</option><option>litre</option><option>bucket</option><option>bottle</option></datalist></div>
        <div class="field"><label for="p-sort">Display order</label><input id="p-sort" name="sort" type="number" min="0" placeholder="Smaller shows first"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="p-price">Price (₹)</label><input id="p-price" name="price" type="number" min="0" step="0.01" placeholder="Empty shows “Ask for price”"></div>
        <div class="field"><label for="p-mrp">MRP (₹, optional)</label><input id="p-mrp" name="mrp" type="number" min="0" step="0.01"></div>
      </div>
      <div class="field"><label for="p-desc">Description</label><textarea id="p-desc" name="description" maxlength="600"></textarea></div>
      <div class="field"><label for="p-img">Photo <span class="muted">(leave empty normally)</span></label><input id="p-img" name="image" placeholder="Leave empty to use images/item-code.jpg" maxlength="500"><span class="hint" id="pcode"></span></div>
      <div class="field"><label for="p-tags">Search words</label><input id="p-tags" name="tags" placeholder="Hindi or local names, e.g. sariya eent ret" maxlength="200"></div>
      <div class="checks">
        <label class="sw"><input type="checkbox" name="inStock">In stock</label>
        <label class="sw"><input type="checkbox" name="visible">Show on site</label>
        <label class="sw"><input type="checkbox" name="featured">Show on rate board</label>
      </div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn btn-danger sp" id="pdel">Delete</button>
      <button type="button" class="btn btn-ghost" data-close>Cancel</button>
      <button type="submit" class="btn btn-dark" id="psave" value="save">Save item</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="admin.js"></script>
</body>
</html>
