<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enquiry | Shani Traders</title>
<meta name="description" content="Send your building material list to Shani Traders and get a confirmed rate.">
<meta name="theme-color" content="#1E252B">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="enquiry">
<div id="site-header"></div>
<main id="main">
<section class="page-head"><div class="wrap">
  <h1>Your enquiry</h1><p>Send your list and we call you back with the rate and delivery time. No payment is taken online.</p>
</div></section>
<div class="wrap enq">
  <section class="panel" aria-labelledby="l-title">
    <div class="section-head" style="margin-bottom:8px"><h2 id="l-title" style="margin:0">Items</h2><button class="btn btn-ghost btn-sm" id="clear" hidden>Clear list</button></div>
    <ul class="items" id="items"></ul>
    <div id="list-acts" style="margin-top:14px"></div>
  </section>
  <section class="panel" aria-labelledby="f-title" id="form-panel">
    <h2 id="f-title">Your details</h2>
    <div id="fmsg"></div>
    <form id="f" novalidate>
      <div class="field"><label for="name">Name</label><input id="name" name="name" required autocomplete="name" maxlength="80"></div>
      <div class="field"><label for="phone">Mobile number</label><input id="phone" name="phone" required inputmode="numeric" autocomplete="tel" maxlength="14" placeholder="10-digit number"></div>
      <div class="row2">
        <div class="field"><label for="place">Village or town</label><input id="place" name="place" maxlength="80"></div>
        <div class="field"><label for="delivery">Delivery</label>
          <select id="delivery" name="delivery"><option>Deliver to my site</option><option>I will pick up from shop</option><option>Not decided yet</option></select></div>
      </div>
      <div class="field"><label for="email">Email <span class="muted">(optional)</span></label><input id="email" name="email" type="email" autocomplete="email" maxlength="120"><span class="hint">We send a copy of your enquiry here.</span></div>
      <div class="field"><label for="message">Anything else?</label><textarea id="message" name="message" maxlength="1500" placeholder="Items not on the site, size of the house, when you need the material…"></textarea></div>
      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn btn-dark btn-block" id="send">Send enquiry</button>
    </form>
  </section>
</div>
</main>
<div id="site-footer"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
(() => {
  const { $, esc, List, listText, waLink, api, svg, S } = ST;
  function renderList() {
    const a = List.get();
    $('#clear').hidden = !a.length;
    $('#items').innerHTML = a.length ? a.map(x => `<li data-id="${esc(x.id)}">
      <span class="nm">${esc(x.name)}<small>${esc(x.brand || '')}${x.brand ? ', ' : ''}per ${esc(x.unit)}</small></span>
      <span class="qty"><button type="button" data-step="-1" aria-label="Less">−</button><input type="number" min="1" value="${Number(x.qty)}" aria-label="Quantity of ${esc(x.name)}"><button type="button" data-step="1" aria-label="More">+</button></span>
      <button class="rm" type="button">Remove</button></li>`).join('')
      : '<li style="display:block"><p class="muted" style="margin:0">Your list is empty. Add items from the catalogue, or just write what you need in the message.</p></li>';
    $('#list-acts').innerHTML = a.length
      ? `<a class="btn btn-wa btn-block" target="_blank" rel="noopener" href="${waLink('Namaste ' + S.name + ', please share rates for:\n' + listText(a))}">${svg('wa')}Send this list on WhatsApp</a>`
      : '<a class="btn btn-ghost btn-block" href="products.html">Browse products</a>';
  }
  $('#items').addEventListener('click', e => {
    const li = e.target.closest('li[data-id]'); if (!li) return;
    if (e.target.closest('.rm')) return List.remove(li.dataset.id);
    const b = e.target.closest('[data-step]');
    if (b) { const i = li.querySelector('input'); List.setQty(li.dataset.id, (parseInt(i.value, 10) || 1) + Number(b.dataset.step)); }
  });
  $('#items').addEventListener('change', e => { const li = e.target.closest('li[data-id]'); if (li && e.target.matches('input')) List.setQty(li.dataset.id, parseInt(e.target.value, 10) || 1); });
  $('#clear').addEventListener('click', () => { if (confirm('Remove all items from the list?')) List.clear(); });
  document.addEventListener('list:change', renderList);
  renderList();

  const f = $('#f'), msg = $('#fmsg'), btn = $('#send');
  const show = (t, cls) => { msg.innerHTML = t ? `<p class="msg ${cls}">${t}</p>` : ''; };
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    const phone = String(d.phone).replace(/\D/g, '').slice(-10);
    const items = List.get();
    if (!d.name.trim()) { show('Enter your name.', 'err'); return $('#name').focus(); }
    if (phone.length !== 10) { show('Enter a 10-digit mobile number.', 'err'); return $('#phone').focus(); }
    if (!items.length && !d.message.trim()) { show('Add items to your list or write what you need in the message.', 'err'); return $('#message').focus(); }
    const text = listText(items);
    if (!S.apiUrl) {
      window.open(waLink(`Namaste ${S.name}, new enquiry\nName: ${d.name}\nMobile: ${phone}\nPlace: ${d.place}\nDelivery: ${d.delivery}\n\n${text}\n\n${d.message}`), '_blank');
      return;
    }
    btn.disabled = true; btn.textContent = 'Sending…'; show('');
    try {
      const r = await api({ action: 'enquiry', name: d.name, phone, email: d.email, place: d.place, delivery: d.delivery, message: d.message, items: text, website: d.website, source: 'Website form' });
      List.clear(); f.reset();
      $('#form-panel').innerHTML = `<div class="done"><h2>Enquiry sent</h2><p>Your reference is <b>${esc(r.enquiryId)}</b>. We will call you on ${esc(phone)} soon${d.email ? ' and a copy is on its way to your email' : ''}.</p><a class="btn btn-dark" href="products.html">Back to products</a></div>`;
    } catch (err) {
      show(`${esc(err.message)} You can also <a href="${waLink('Namaste ' + S.name + ', please share rates for:\n' + text + '\n' + d.message)}" target="_blank" rel="noopener">send it on WhatsApp</a>.`, 'err');
      btn.disabled = false; btn.textContent = 'Send enquiry';
    }
  });
})();
</script>
</body>
</html>
